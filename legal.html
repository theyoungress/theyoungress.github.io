<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Young Ress | Terms, privacy and license</title>
<meta name="description" content="Young Ress Terms of Service, Privacy Policy and Plug-in License.">
<meta name="theme-color" content="#0d1626">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1626'/%3E%3Crect x='8' y='11' width='4' height='12' rx='2' fill='%23efe6c9'/%3E%3Crect x='14' y='6' width='4' height='17' rx='2' fill='%23efe6c9'/%3E%3Crect x='20' y='14' width='4' height='9' rx='2' fill='%23e0473a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root { --ink: #0d1626; --cream: #efe6c9; --steel: #9aa6b9; --lamp: #e0473a; --rule: rgba(239, 230, 201, .14); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--cream); font: 400 17px/1.65 "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.wrap { width: min(760px, 100% - 32px); margin-inline: auto; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 40px 0 72px; font-size: 15px; }
.logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 800; font-stretch: 125%; letter-spacing: .08em; }
.logo i { display: inline-flex; gap: 3px; align-items: flex-end; height: 18px; }
.logo b { display: block; width: 4px; border-radius: 2px; background: var(--cream); }
.logo b:nth-child(1) { height: 12px; } .logo b:nth-child(2) { height: 18px; } .logo b:nth-child(3) { height: 9px; background: var(--lamp); }
.bar nav { display: flex; gap: 20px; flex-wrap: wrap; }
.bar nav a { color: var(--steel); text-decoration: none; }
.bar nav a:hover { color: var(--cream); }
h1, h2, h3 { font-stretch: 125%; font-weight: 800; letter-spacing: -.015em; line-height: 1.05; }
h1 { font-size: clamp(38px, 6vw, 60px); margin: 0 0 12px; }
.updated { color: var(--steel); margin: 0 0 56px; }
section { padding: 48px 0; border-top: 1px solid var(--rule); scroll-margin-top: 16px; }
h2 { font-size: 32px; margin: 0 0 28px; }
h3 { font-size: 19px; margin: 36px 0 10px; }
p, li { color: #d6d0bd; }
ul { padding-left: 22px; }
li { margin-bottom: 8px; }
b { color: var(--cream); }
footer { padding: 48px 0 64px; color: var(--steel); font-size: 15px; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="logo" href="./"><i aria-hidden="true"><b></b><b></b><b></b></i>YOUNG RESS</a>
    <nav aria-label="Documents"><a href="#terms">Terms</a><a href="#privacy">Privacy</a><a href="#eula">License</a></nav>
  </div>
  <h1>Terms, privacy and license</h1>
  <p class="updated" id="updated"></p>
  <main id="docs"><noscript><p>Turn on JavaScript to read these documents, or email theyoungress@gmail.com for a copy.</p></noscript></main>
  <footer>Questions? Email <a href="mailto:theyoungress@gmail.com">theyoungress@gmail.com</a>. <a href="./">Back to Young Ress</a></footer>
</div>
<script src="legal.js"></script>
<script>
// The same documents Young Ress Hub shows and customers agree to (legal.js is copied from the hub).
const SUPPORT = "theyoungress@gmail.com";
const L = window.YR_LEGAL;
document.getElementById("updated").textContent = "Last updated " + L.updated + ".";
document.getElementById("docs").innerHTML = ["terms", "privacy", "eula"]
  .map((id) => `<section id="${id}"><h2>${L.docs[id].title}</h2>${L.docs[id].html}</section>`).join("");
document.querySelectorAll("a[data-doc]").forEach((a) => {
  if (L.docs[a.dataset.doc]) a.href = "#" + a.dataset.doc;
  else a.replaceWith(a.textContent);   // documents that only live inside the hub
});
document.querySelectorAll(".contact").forEach((s) => (s.innerHTML = `<a href="mailto:${SUPPORT}">${SUPPORT}</a>`));
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
