<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Young Ress | Terms, privacy and license</title>
<meta name="description" content="Young Ress Terms of Service, Privacy Policy and Plug-in License.">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0c'/%3E%3Crect x='8' y='11' width='4' height='12' rx='2' fill='%23b77ce2'/%3E%3Crect x='14' y='6' width='4' height='17' rx='2' fill='%239763c2'/%3E%3Crect x='20' y='14' width='4' height='9' rx='2' fill='%2369488a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
:root { --ink: #0b0b0c; --muted: #62666e; --line: #e7e8eb; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--ink); font: 400 16px/1.65 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid #9763c2; outline-offset: 3px; }
.top { background: #0b0b0c; color: #fff; }
.wrap { width: min(760px, 100% - 32px); margin-inline: auto; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; height: 68px; font-size: 15px; }
.logo { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; font-weight: 800; letter-spacing: .14em; font-size: 14px; }
.logo i { display: inline-flex; gap: 3px; align-items: flex-end; height: 18px; }
.logo b { display: block; width: 4px; border-radius: 2px; background: #b77ce2; }
.logo b:nth-child(1) { height: 12px; } .logo b:nth-child(2) { height: 18px; background: #9763c2; } .logo b:nth-child(3) { height: 9px; background: #69488a; }
.bar nav { display: flex; gap: 22px; flex-wrap: wrap; }
.bar nav a { color: #d9d9de; text-decoration: none; font-weight: 500; }
.bar nav a:hover { color: #fff; }
h1, h2, h3 { letter-spacing: -.02em; line-height: 1.15; }
h1 { font-size: clamp(34px, 5vw, 48px); font-weight: 800; margin: 72px 0 8px; }
.updated { color: var(--muted); margin: 0 0 48px; }
section { padding: 44px 0; border-top: 1px solid var(--line); scroll-margin-top: 16px; }
h2 { font-size: 28px; font-weight: 700; margin: 0 0 24px; }
h3 { font-size: 17px; font-weight: 700; margin: 32px 0 8px; }
p, li { color: #34373d; }
ul { padding-left: 22px; }
li { margin-bottom: 8px; }
footer { padding: 40px 0 64px; color: var(--muted); font-size: 15px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="logo" href="./"><i aria-hidden="true"><b></b><b></b><b></b></i>YOUNG RESS</a>
  <nav aria-label="Documents"><a href="#terms">Terms</a><a href="#privacy">Privacy</a><a href="#eula">License</a></nav>
</div></header>
<div class="wrap">
  <h1>Terms, privacy and license</h1>
  <p class="updated" id="updated"></p>
  <main id="docs"><noscript><p>Turn on JavaScript to read these documents, or email theyoungress@gmail.com for a copy.</p></noscript></main>
  <footer>Questions? Email <a href="mailto:theyoungress@gmail.com">theyoungress@gmail.com</a>. <a href="./">Back to Young Ress</a></footer>
</div>
<script src="legal.js"></script>
<script>
// The same documents Young Ress Hub shows and customers agree to (legal.js is copied from the hub).
const SUPPORT = "theyoungress@gmail.com";
const L = window.YR_LEGAL;
document.getElementById("updated").textContent = "Last updated " + L.updated + ".";
document.getElementById("docs").innerHTML = ["terms", "privacy", "eula"]
  .map((id) => `<section id="${id}"><h2>${L.docs[id].title}</h2>${L.docs[id].html}</section>`).join("");
document.querySelectorAll("a[data-doc]").forEach((a) => {
  if (L.docs[a.dataset.doc]) a.href = "#" + a.dataset.doc;
  else a.replaceWith(a.textContent);   // documents that only live inside the hub
});
document.querySelectorAll(".contact").forEach((s) => (s.innerHTML = `<a href="mailto:${SUPPORT}">${SUPPORT}</a>`));
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
